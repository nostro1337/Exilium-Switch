appId: com.nostro.exiliumswitch
productName: Exilium Switch
copyright: Copyright © 2026 Nostro
directories:
  output: release
publish:
  provider: github
  owner: nostro1337
  repo: Exilium-Switch
  releaseType: release
files:
  - dist
  - dist-electron
  - build/icon.ico
  - build/icon.png
  - assets/**
extraResources:
  - from: "build/app-update.yml"
    to: "app-update.yml"
  - from: "build/icon.ico"
    to: "icon.ico"
  - from: "build/icon.png"
    to: "icon.png"
  - from: "assets/icons/ExiliumSwitchIcon.ico"
    to: "assets/icons/ExiliumSwitchIcon.ico"
  - from: "assets/icons/ExiliumAppIcon.ico"
    to: "assets/icons/ExiliumAppIcon.ico"
  - from: "sing-box"
    to: "sing-box"
    filter:
      - "sing-box.exe"
      - "libcronet.dll"
      - "!config.json"
      - "!*.json"
      - "!*.bat"
      - "!*.ps1"
afterPack: scripts/after-pack.cjs
win:
  icon: "build/icon.ico"
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: highestAvailable
  sign: null
  signDlls: false
  signAndEditExecutable: false
  forceCodeSigning: false
nsis:
  oneClick: true
  perMachine: true
  allowElevation: true
  differentialPackage: true
  installerIcon: "build/installerIcon.ico"
  uninstallerIcon: "build/uninstallerIcon.ico"
  installerHeaderIcon: "build/installerIcon.ico"
  installerSidebar: "build/installerSidebar.bmp"
  uninstallerSidebar: "build/uninstallerSidebar.bmp"
  installerHeader: "build/installerHeader.bmp"
  include: "build/installer.nsh"
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "Exilium Switch"
  artifactName: "Exilium Switch Setup ${version}.${ext}"
  deleteAppDataOnUninstall: false
  runAfterFinish: true
portable:
  artifactName: "Exilium Switch Portable.exe"
  requestExecutionLevel: "admin"
